<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa6ff"/>
      <stop offset="1" stop-color="#0a5fd1"/>
    </linearGradient>
    <clipPath id="front"><rect x="362" y="222" width="300" height="600" rx="44"/></clipPath>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#002a66" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#drop)"/>
  <rect x="362" y="222" width="300" height="600" rx="44" fill="#cfe4ff" transform="rotate(-13 512 780)" filter="url(#lift)"/>
  <rect x="362" y="222" width="300" height="600" rx="44" fill="#e6f1ff" transform="rotate(13 512 780)" filter="url(#lift)"/>
  <g filter="url(#lift)">
    <rect x="362" y="222" width="300" height="600" rx="44" fill="#ffffff"/>
    <g clip-path="url(#front)">
      <rect x="412" y="282" width="200" height="34" rx="17" fill="#1e1e1e"/>
      <rect x="442" y="336" width="140" height="20" rx="10" fill="#a4acb6"/>
      <rect x="417" y="400" width="190" height="460" rx="38" fill="#e9f3ff" stroke="#1e1e1e" stroke-width="14"/>
      <rect x="482" y="420" width="60" height="16" rx="8" fill="#1e1e1e"/>
    </g>
  </g>
</svg>
