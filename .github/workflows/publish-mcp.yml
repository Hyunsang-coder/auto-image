name: Publish MCP package

# The app and packages/mcp version independently, and the easy failure is
# shipping a release whose agent half is still a version behind on npm. Tie the
# publish to the release tag so it cannot be forgotten.
#
# Auth is OIDC trusted publishing, not a token: npm revoked classic (including
# Automation) tokens in December 2025, and the granular token that replaced them
# expires every 90 days and loses publish rights in January 2027. The trust is
# configured on the package at npmjs.com — org, repo, and *this filename* — so
# renaming this file breaks publishing until npm is told the new name.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # id-token is what lets the runner mint the OIDC token npm verifies.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      # No `registry-url`: it writes an .npmrc carrying `_authToken=${NODE_AUTH_TOKEN}`
      # and exports a placeholder value for that variable, and npm then publishes
      # with that junk credential instead of reaching for the OIDC token at all
      # (a 404 on the PUT, which reads like the package does not exist).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Root deps, not packages/mcp's: the package's `prepack` runs
      # `npm run --prefix ../.. mcp:package`, which needs tsx and the TS
      # constants to regenerate data/design-reference.json.
      - run: npm ci

      # Trusted publishing landed in npm 11.5.1; an older npm silently falls
      # back to token auth, which no longer exists here.
      - run: npm install -g npm@latest

      - run: |
          echo "npm $(npm -v)  node $(node -v)"
          echo "id-token env: ${ACTIONS_ID_TOKEN_REQUEST_URL:+present}${ACTIONS_ID_TOKEN_REQUEST_URL:-ABSENT}"
          echo "userconfig: ${NPM_CONFIG_USERCONFIG:-none}"
          cat "${NPM_CONFIG_USERCONFIG:-/dev/null}" 2>/dev/null | sed 's/=.*/=<redacted>/' || true

      # A tag can be pushed without the package version having moved, and a
      # re-run of this workflow must not fail on an already-published version.
      - id: check
        run: |
          local_version="$(node -p "require('./packages/mcp/package.json').version")"
          name="$(node -p "require('./packages/mcp/package.json').name")"
          echo "version=$local_version" >> "$GITHUB_OUTPUT"
          # `npm view` exits non-zero when the version does not exist, which is
          # exactly the case we want to publish in — so don't let -e kill it.
          if npm view "$name@$local_version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$local_version is already on npm — nothing to publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # No NODE_AUTH_TOKEN: npm uses the OIDC token when it finds one, and a
      # token in the environment would take precedence over it.
      - if: steps.check.outputs.publish == 'true'
        run: npm publish
        working-directory: packages/mcp

      - if: steps.check.outputs.publish == 'true'
        run: echo "::notice::published ${{ steps.check.outputs.version }}"
